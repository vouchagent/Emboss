[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emboss-pdf"
version = "0.5.0"
description = "Deterministic, PDF/UA-tagged, veraPDF-conformant PDF generation for Python, built for LLM-driven document pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Gaurav Gupta" }]
keywords = ["pdf", "typesetting", "accessibility", "pdf-ua", "knuth-plass"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]

dependencies = ["fonttools>=4.40"]

[project.optional-dependencies]
llm = ["pydantic>=2.0"]
verify = ["pikepdf>=8.0"]
signing = ["cryptography>=41.0"]
mcp = ["mcp>=1.2.0", "pikepdf>=8.0", "pydantic>=2.0"]
dev = ["pytest>=7.4", "pikepdf>=8.0", "pydantic>=2.0", "cryptography>=41.0", "mypy>=1.8", "ruff==0.15.21"]
all = ["pydantic>=2.0", "pikepdf>=8.0", "cryptography>=41.0", "mcp>=1.2.0"]

[project.scripts]
emboss = "emboss.__main__:main"
emboss-mcp = "emboss.mcp_server:main"

[project.urls]
Homepage = "https://github.com/GGChamp85/Emboss"
Documentation = "https://github.com/GGChamp85/Emboss#readme"
Issues = "https://github.com/GGChamp85/Emboss/issues"
Changelog = "https://github.com/GGChamp85/Emboss/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emboss = ["py.typed", "typography/patterns/*.txt", "typography/patterns/*.txt.gz", "fonts/*.ttf", "fonts/*.otf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly so a ruff version bump cannot silently add
# hundreds of new default rules and break CI.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
